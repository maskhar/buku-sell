services:
  buku-sell:
    build:
      context: .
      args:
        VITE_CHECKOUT_SINGLE: ${VITE_CHECKOUT_SINGLE:-}
        VITE_CHECKOUT_FOUR: ${VITE_CHECKOUT_FOUR:-}
        VITE_CHECKOUT_SIX: ${VITE_CHECKOUT_SIX:-}
        VITE_CHECKOUT_BALIK: ${VITE_CHECKOUT_BALIK:-}
        VITE_CHECKOUT_WMETHOD: ${VITE_CHECKOUT_WMETHOD:-}
        VITE_CHECKOUT_DOSEEN: ${VITE_CHECKOUT_DOSEEN:-}
        VITE_CHECKOUT_MIRING: ${VITE_CHECKOUT_MIRING:-}
        VITE_CHECKOUT_CITY: ${VITE_CHECKOUT_CITY:-}
        VITE_CHECKOUT_MONETIZED: ${VITE_CHECKOUT_MONETIZED:-}
        VITE_PROMO_DEADLINE: ${VITE_PROMO_DEADLINE:-}
        VITE_TESTIMONIALS: ${VITE_TESTIMONIALS:-}
        VITE_ORDERS: ${VITE_ORDERS:-}
        VITE_SOCIAL_PROOF_MODE: ${VITE_SOCIAL_PROOF_MODE:-}
        VITE_GOOGLE_SITE_VERIFICATION: ${VITE_GOOGLE_SITE_VERIFICATION:-}
        VITE_GA4_MEASUREMENT_ID: ${VITE_GA4_MEASUREMENT_ID:-}
        VITE_GTM_CONTAINER_ID: ${VITE_GTM_CONTAINER_ID:-}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - carubra-network

networks:
  carubra-network:
    external: true
